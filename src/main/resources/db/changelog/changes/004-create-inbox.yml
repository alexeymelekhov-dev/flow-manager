databaseChangeLog:
  - changeSet:
      id: 004-create-inbox
      author: Alexey
      comment: Create inbox table for tracking processed consumer events

      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                tableName: inbox

      changes:
        - createTable:
            tableName: inbox
            remarks: Stores identifiers of processed consumer events

            columns:
              - column:
                  name: event_id
                  type: UUID
                  remarks: Unique identifier of the processed event
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: Timestamp when the event was processed
                  defaultValueDate: now()
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: inbox
