databaseChangeLog:
  - changeSet:
      id: 005-create-converted-files
      author: Alexey
      changes:
        - createTable:
            tableName: converted_files
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: file_id
                  type: UUID
                  constraints:
                    nullable: false
